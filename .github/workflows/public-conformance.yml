name: Public checker conformance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  public-checkers:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Explicit credential-free pinned image setup
        run: docker pull 'python:3.12.12-slim-bookworm@sha256:2986c55feb36e6cae00fa1fefb454283e4b33f35e75ff8bdd123b134130be301'
      - name: Public known-answer checker cases (no model review)
        run: python3 tools/public_conformance.py --root .
