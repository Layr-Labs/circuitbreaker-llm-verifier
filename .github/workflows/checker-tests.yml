name: Checker tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checkers:
    uses: Layr-Labs/llm-verifier/.github/workflows/test-checkers.yml@8c1f098875fae0750c29ecfd641f7c9fc53a0f41
    with:
      verifier_repository: Layr-Labs/llm-verifier
      verifier_revision: 8c1f098875fae0750c29ecfd641f7c9fc53a0f41
      root_dir: '.'
    secrets:
      VERIFIER_CHECKOUT_TOKEN: ${{ secrets.VERIFIER_CHECKOUT_TOKEN }}

  expressions:
    name: Test expressions, exporter and generated integration
    needs: [checkers]
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: llmv-checker-package
          path: ${{ runner.temp }}/checker-package/
      - name: Run challenge tests without supplied credentials
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/llmv-env"
          "$RUNNER_TEMP/llmv-env/bin/python" -m pip install --no-index --no-deps "$RUNNER_TEMP"/checker-package/wheel/*.whl
          mkdir "$RUNNER_TEMP/challenge"
          tar -xf "$RUNNER_TEMP/checker-package/challenge.tar" -C "$RUNNER_TEMP/challenge"
          cd "$RUNNER_TEMP/challenge"
          env -i PATH="$PATH" "$RUNNER_TEMP/llmv-env/bin/python" check_submission.py
          env -i PATH="$PATH" "$RUNNER_TEMP/llmv-env/bin/python" -m unittest -v
          env -i PATH="$PATH" "$RUNNER_TEMP/llmv-env/bin/python" tools/generate_hosted.py --check
