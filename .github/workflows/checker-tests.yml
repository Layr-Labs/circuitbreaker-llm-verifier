name: Checker tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checkers:
    uses: Layr-Labs/llm-verifier/.github/workflows/test-checkers.yml@330939ca2118c69a778c44cb16e4cabc38962854
    with:
      verifier_repository: Layr-Labs/llm-verifier
      verifier_revision: 330939ca2118c69a778c44cb16e4cabc38962854
      root_dir: '.'
    secrets:
      VERIFIER_CHECKOUT_TOKEN: ${{ secrets.VERIFIER_CHECKOUT_TOKEN }}
