name: Checker tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checkers:
    uses: Layr-Labs/llm-verifier/.github/workflows/test-checkers.yml@085cc7249028157f80f4689a9eaa342f5c92fca8
    with:
      verifier_repository: Layr-Labs/llm-verifier
      verifier_revision: 085cc7249028157f80f4689a9eaa342f5c92fca8
      root_dir: '.'
    secrets:
      VERIFIER_CHECKOUT_TOKEN: ${{ secrets.VERIFIER_CHECKOUT_TOKEN }}
