name: Materialized score derivation checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checkers:
    uses: Layr-Labs/llm-verifier/.github/workflows/test-checkers.yml@fa3c2044e179e919bfb09b890594f21458ef142a
    with:
      verifier_repository: Layr-Labs/llm-verifier
      verifier_revision: fa3c2044e179e919bfb09b890594f21458ef142a
      root_dir: '.'
    secrets:
      VERIFIER_CHECKOUT_TOKEN: ${{ secrets.VERIFIER_CHECKOUT_TOKEN }}
  profile:
    name: Validate materialized score derivation source
    needs: [checkers]
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: llmv-checker-package
          path: ${{ runner.temp }}/checker-package/
      - name: Validate profile, baseline and domain boundaries without credentials
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/llmv-env"
          "$RUNNER_TEMP/llmv-env/bin/python" -m pip install --no-index --no-deps "$RUNNER_TEMP"/checker-package/wheel/*.whl
          mkdir "$RUNNER_TEMP/challenge"
          tar -xf "$RUNNER_TEMP/checker-package/challenge.tar" -C "$RUNNER_TEMP/challenge"
          cd "$RUNNER_TEMP/challenge"
          env -i PATH="$PATH" "$RUNNER_TEMP/llmv-env/bin/python" tools/check_derivation_profile.py
          env -i PATH="$PATH" "$RUNNER_TEMP/llmv-env/bin/python" -m unittest tests.test_score_derivation -v
          env -i PATH="$PATH" "$RUNNER_TEMP/llmv-env/bin/python" tools/generate_hosted.py --check
