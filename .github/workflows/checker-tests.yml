name: Checker tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checkers:
    uses: Layr-Labs/llm-verifier/.github/workflows/test-checkers.yml@50c61e5de514b6d27eab63af943aeca8c8992838
    with:
      verifier_repository: Layr-Labs/llm-verifier
      verifier_revision: 50c61e5de514b6d27eab63af943aeca8c8992838
      root_dir: '.'
    secrets:
      VERIFIER_CHECKOUT_TOKEN: ${{ secrets.VERIFIER_CHECKOUT_TOKEN }}
