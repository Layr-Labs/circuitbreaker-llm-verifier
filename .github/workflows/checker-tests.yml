name: Checker tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checkers:
    uses: Layr-Labs/llm-verifier/.github/workflows/test-checkers.yml@df87657583a0ab2161ccfcc9a8797aceffae2340
    with:
      verifier_repository: Layr-Labs/llm-verifier
      verifier_revision: df87657583a0ab2161ccfcc9a8797aceffae2340
      root_dir: '.'
    secrets:
      VERIFIER_CHECKOUT_TOKEN: ${{ secrets.VERIFIER_CHECKOUT_TOKEN }}
