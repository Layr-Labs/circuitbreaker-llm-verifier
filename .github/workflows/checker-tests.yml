name: Checker tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checkers:
    uses: Layr-Labs/llm-verifier/.github/workflows/test-checkers.yml@8fbf3b30895ea83c0996e460176e3f154c2b4c85
    with:
      verifier_repository: Layr-Labs/llm-verifier
      verifier_revision: 8fbf3b30895ea83c0996e460176e3f154c2b4c85
      root_dir: '.'
    secrets:
      VERIFIER_CHECKOUT_TOKEN: ${{ secrets.VERIFIER_CHECKOUT_TOKEN }}
