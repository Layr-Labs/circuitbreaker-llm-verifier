name: Checker tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checkers:
    uses: Layr-Labs/llm-verifier/.github/workflows/test-checkers.yml@b8945a4dac79c02f3398de1e7ff175b1f1508903
    with:
      verifier_repository: Layr-Labs/llm-verifier
      verifier_revision: b8945a4dac79c02f3398de1e7ff175b1f1508903
      root_dir: '.'
    secrets:
      VERIFIER_CHECKOUT_TOKEN: ${{ secrets.VERIFIER_CHECKOUT_TOKEN }}
