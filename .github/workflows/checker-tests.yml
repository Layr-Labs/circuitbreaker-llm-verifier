name: Checker tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checkers:
    uses: Layr-Labs/llm-verifier/.github/workflows/test-checkers.yml@766397640412242474bf7d19cb081792f729c352
    with:
      verifier_repository: Layr-Labs/llm-verifier
      verifier_revision: 766397640412242474bf7d19cb081792f729c352
      root_dir: '.'
    secrets:
      VERIFIER_CHECKOUT_TOKEN: ${{ secrets.VERIFIER_CHECKOUT_TOKEN }}
