name: Benchmark
on:
  workflow_dispatch:
    inputs:
      yukon_evaluation:
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  verify:
    uses: Layr-Labs/llm-verifier/.github/workflows/verify.yml@b8945a4dac79c02f3398de1e7ff175b1f1508903
    with:
      verifier_repository: Layr-Labs/llm-verifier
      verifier_revision: b8945a4dac79c02f3398de1e7ff175b1f1508903
      root_dir: '.'
      config_path: verifier.json
      submission_path: submission
      score_path: .yukon/score.json
      yukon_evaluation: ${{ inputs.yukon_evaluation }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      VERIFIER_CHECKOUT_TOKEN: ${{ secrets.VERIFIER_CHECKOUT_TOKEN }}
