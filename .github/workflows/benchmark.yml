# Access and read-only checkout credentials must be configured separately.
name: Benchmark
on:
  workflow_dispatch:
    inputs:
      yukon_evaluation:
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  verify:
    uses: Layr-Labs/llm-verifier/.github/workflows/verify.yml@e6952b76b1057b026f408f88c3e8c55b419f7344
    with:
      verifier_repository: Layr-Labs/llm-verifier
      verifier_revision: e6952b76b1057b026f408f88c3e8c55b419f7344
      root_dir: '.'
      config_path: verifier.json
      submission_path: submission
      score_path: .yukon/score.json
      yukon_evaluation: ${{ inputs.yukon_evaluation }}
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      VERIFIER_CHECKOUT_TOKEN: ${{ secrets.VERIFIER_CHECKOUT_TOKEN }}
