name: Benchmark
on:
  workflow_dispatch:
    inputs:
      yukon_evaluation:
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  verify:
    uses: Layr-Labs/llm-verifier/.github/workflows/verify.yml@766397640412242474bf7d19cb081792f729c352
    with:
      verifier_repository: Layr-Labs/llm-verifier
      verifier_revision: 766397640412242474bf7d19cb081792f729c352
      root_dir: '.'
      config_path: verifier.json
      submission_path: submission
      score_path: .yukon/score.json
      yukon_evaluation: ${{ inputs.yukon_evaluation }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      VERIFIER_CHECKOUT_TOKEN: ${{ secrets.VERIFIER_CHECKOUT_TOKEN }}
