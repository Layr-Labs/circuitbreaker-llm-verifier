name: Benchmark
on:
  workflow_dispatch:
    inputs:
      yukon_evaluation:
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  verify:
    uses: Layr-Labs/llm-verifier/.github/workflows/verify.yml@92d77b8d6ad783501067a43279a95ee40df5a235
    with:
      verifier_repository: Layr-Labs/llm-verifier
      verifier_revision: 92d77b8d6ad783501067a43279a95ee40df5a235
      root_dir: '.'
      config_path: verifier.json
      submission_path: submission
      score_path: .yukon/score.json
      yukon_evaluation: ${{ inputs.yukon_evaluation }}
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      VERIFIER_CHECKOUT_TOKEN: ${{ secrets.VERIFIER_CHECKOUT_TOKEN }}
