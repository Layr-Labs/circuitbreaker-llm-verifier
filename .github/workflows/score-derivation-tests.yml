name: Score derivation integration
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  derivation:
    name: Test new verifier and CircuitBreaker adapter without model calls
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: challenge
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: Layr-Labs/llm-verifier
          ref: fa3c2044e179e919bfb09b890594f21458ef142a
          token: ${{ secrets.VERIFIER_CHECKOUT_TOKEN || github.token }}
          path: verifier
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Install the exact reviewed implementation
        shell: bash
        run: |
          test "$(git -C verifier rev-parse HEAD)" = fa3c2044e179e919bfb09b890594f21458ef142a
          python3 -m venv "$RUNNER_TEMP/llmv-env"
          "$RUNNER_TEMP/llmv-env/bin/python" -m pip wheel --no-deps ./verifier --wheel-dir "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/llmv-env/bin/python" -m pip install --no-index --no-deps "$RUNNER_TEMP"/wheel/*.whl
      - name: Require derivation support and run offline integration
        shell: bash
        run: |
          cd challenge
          env -i PATH="$PATH" "$RUNNER_TEMP/llmv-env/bin/python" -c 'from llm_verifier import derivation; assert callable(derivation.prepare)'
          env -i PATH="$PATH" "$RUNNER_TEMP/llmv-env/bin/python" -m unittest tests.test_score_derivation tests.test_derivation_integration -v
